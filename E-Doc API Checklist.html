<title>E-Doc API Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Sticky progress header, then build-order sections, each a stack of collapsible file groups. */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --fg:#142033; --muted:#5b6a7d; --line:#dce2ea;
  --accent:#1b5fc4; --done:#1a7a4c; --donebg:#e4f3ea; --p2:#845400; --p2bg:#fff1d0; --track:#e3e8ef;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#151d28; --fg:#e5eaf1; --muted:#93a1b4; --line:#243040;
  --accent:#74a8ff; --done:#4cc58b; --donebg:#14291f; --p2:#e2b45f; --p2bg:#2a2210; --track:#243040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#151d28; --fg:#e5eaf1; --muted:#93a1b4; --line:#243040;
  --accent:#74a8ff; --done:#4cc58b; --donebg:#14291f; --p2:#e2b45f; --p2bg:#2a2210; --track:#243040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
header{background:var(--bg);padding:18px 0 12px;border-bottom:1px solid var(--line)}
@media (min-width:700px) and (min-height:640px){header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10}}
h1{font-size:22px;line-height:1.2;margin:0 0 2px;font-weight:600;text-wrap:balance}
.lede{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.overall{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:15px;color:var(--muted);font-weight:400}
.pct{color:var(--muted);font-variant-numeric:tabular-nums}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
.sync[data-s="error"]{color:#b3261e}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.tools{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:13px}
.tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tools button{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.tools .sp{flex:1}
.note{margin:12px 0 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--muted);background:var(--surface)}
section{margin-top:28px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.sh h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0;font-weight:600}
.sh .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.blurb{margin:0 0 10px;font-size:13px;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:8px}
summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 3px 0 2px;grid-row:1/3}
details[open]>summary::before{transform:rotate(45deg)}
summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gt{font-weight:500;font-family:var(--font-mono);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.gc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gs{grid-column:2/4;font-size:12.5px;color:var(--muted);min-width:0}
.gb{grid-column:1/4;height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:6px}
.gb i{display:block;height:100%;width:0;background:var(--done)}
details.full>summary .gc{color:var(--done);font-weight:500}
.rows{border-top:1px solid var(--line)}
.tick{display:block;font:inherit;font-size:12.5px;margin:0;padding:6px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--accent);width:100%;text-align:left;cursor:pointer}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--done);cursor:pointer}
.p{font-family:var(--font-mono);font-size:13px;overflow-wrap:anywhere;line-height:1.4}
.p .d{color:var(--muted)}
.p b{font-weight:500}
.row.done .p b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.n{font-size:12.5px;color:var(--muted);margin-top:1px}
.tag{display:inline-block;font:500 10.5px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:1px;background:var(--track);color:var(--muted)}
.tag.p2{background:var(--p2bg);color:var(--p2)}
.hide-spec .row.spec,.hide-p2 .row.p2,.hide-done .row.done{display:none}
@media (max-width:520px){.sync{margin-left:0;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <button type="button" id="collapse">Collapse all</button>
    </div>
    <div class="note" id="note" hidden></div>
  </header>
  <main id="main"></main>
</div>

", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/dashboard/dashboard.service.spec.ts", "path": "src/modules/dashboard/dashboard.service.spec.ts", "note": "", "kind": "spec", "p2": false}], "open": false}, {"title": "scheduler", "sub": "Table: none. 7-day reminder, escalation, retention jobs", "items": [{"id": "src/modules/scheduler/scheduler.module.ts", "path": "src/modules/scheduler/scheduler.module.ts", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/scheduler/scheduler.controller.ts", "path": "src/modules/scheduler/scheduler.controller.ts", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/scheduler/scheduler.controller.spec.ts", "path": "src/modules/scheduler/scheduler.controller.spec.ts", "note": "", "kind": "spec", "p2": false}, {"id": "src/modules/scheduler/scheduler.service.ts", "path": "src/modules/scheduler/scheduler.service.ts", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/scheduler/scheduler.service.spec.ts", "path": "src/modules/scheduler/scheduler.service.spec.ts", "note": "", "kind": "spec", "p2": false}], "open": false}, {"title": "websockets", "sub": "Table: none. Socket.IO gateway (a gateway file instead of a controller)", "items": [{"id": "src/modules/websockets/websockets.module.ts", "path": "src/modules/websockets/websockets.module.ts", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/websockets/websockets.gateway.ts", "path": "src/modules/websockets/websockets.gateway.ts", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/websockets/websockets.gateway.spec.ts", "path": "src/modules/websockets/websockets.gateway.spec.ts", "note": "", "kind": "spec", "p2": false}, {"id": "src/modules/websockets/websockets.service.ts", "path": "src/modules/websockets/websockets.service.ts", "note": "", "kind": "code", "p2": false}, {"id": "src/modules/websockets/websockets.service.spec.ts", "path": "src/modules/websockets/websockets.service.spec.ts", "note": "", "kind": "spec", "p2 ngs", "items": [{"id": "src/modules/notification-pref/notification-pref.module.ts", "path": "src/modules/notification-pref/notification-pref.module.ts", "note": "", "kind": "code", "p2": true}, {"id": "src/modules/notification-pref/notification-pref.controller.ts", "path": "src/modules/notification-pref/notification-pref.controller.ts", "note": "", "kind": "code", "p2": true}, {"id": "src/modules/notification-pref/notification-pref.controller.spec.ts", "path": "src/modules/notification-pref/notification-pref.controller.spec.ts", "note": "", "kind": "spec", "p2": true}, {"id": "src/modules/notification-pref/notification-pref.service.ts", "path": "src/modules/notification-pref/notification-pref.service.ts", "note": "", "kind": "code", "p2": true}, {"id": "src/modules/notification-pref/notification-pref.service.spec.ts", "path": "src/modules/notification-pref/notification-pref.service.spec.ts", "note": "", "kind": "spec", "p2": true}], "open": false}, {"title": "integration", "sub": "Table: integration_log. Phase 2. HRMS, ERP, Core Banking sync", "items": [{"id": "src/modules/integration/integration.module.ts", "path": "src/modules/integration/integration.module.ts", "note": "", "kind": "code", "p2": true}, {"id": "src/modules/integration/integration.controller.ts", "path": "src/modules/integration/integration.controller.ts", "note": "", "kind": "code", "p2": true}, {"id": "src/modules/integration/integration.controller.spec.ts", "path": "src/modules/integration/integration.controller.spec.ts", "note": "", "kind": "spec", "p2": true}, {"id": "src/modules/integration/integration.service.ts", "path": "src/modules/integration/integration.service.ts", "note": "", "kind": "code", "p2": true}, {"id": "src/modules/integration/integration.service.spec.ts", "path": "src/modules/integration/integration.service.spec.ts", "note": "", "kind": "spec", "p2": true}], "open": false}]}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var done = {};            // id -> true
  var rows = {};            // id -> {box,row}
  var groups = [];          // {el,ids,cnt,bar,sub,tick}
  var secs = [];            // {cnt,ids}
  var allIds = [];

  function $(id){return document.getElementById(id)}
  function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}

  function build(){
    var main = $('main');
    DATA.sections.forEach(function(s){
      var sec = el('section'), sh = el('div','sh'), cnt = el('span','cnt');
      sh.appendChild(el('h2',null,s.title)); sh.appendChild(cnt); sec.appendChild(sh);
      if(s.blurb) sec.appendChild(el('p','blurb',s.blurb));
      var sref = {cnt:cnt, ids:[]}; secs.push(sref);
      s.groups.forEach(function(g){
        var d = el('details'); if(g.open) d.open = true;
        var sm = el('summary'), gt = el('span','gt',g.title), gc = el('span','gc');
        sm.appendChild(gt); sm.appendChild(gc);
        if(g.sub){ sm.appendChild(el('span','gs',g.sub)); }
        var gb = el('div','gb'), gbi = el('i'); gb.appendChild(gbi); sm.appendChild(gb);
        d.appendChild(sm);
        var box = el('div','rows');
        var tick = el('button','tick'); tick.type='button'; box.appendChild(tick);
        var ids = [];
        g.items.forEach(function(it){
          var lab = el('label','row'+(it.kind==='spec'?' spec':'')+(it.p2?' p2':''));
          var cb = document.createElement('input'); cb.type='checkbox'; cb.id='c-'+allIds.length;
          lab.htmlFor = cb.id;
          var body = el('div'), p = el('div','p');
          var i = it.path.lastIndexOf('/', it.path.length-2), dir = it.path.slice(0,i+1), file = it.path.slice(i+1);
          if(dir){ p.appendChild(el('span','d',dir)); }
          p.appendChild(el('b',null,file));
          if(it.kind==='spec') p.appendChild(el('span','tag','spec'));
          if(it.p2) p.appendChild(el('span','tag p2','Phase 2'));
          body.appendChild(p);
          if(it.note) body.appendChild(el('div','n',it.note));
          lab.appendChild(cb); lab.appendChild(body); box.appendChild(lab);
          rows[it.id] = {box:cb,row:lab}; ids.push(it.id); allIds.push(it.id); sref.ids.push(it.id);
          cb.addEventListener('change', function(){ setDone(it.id, cb.checked); });
        });
        d.appendChild(box); sec.appendChild(d);
        var gr = {el:d, ids:ids, cnt:gc, bar:gbi, tick:tick};
        groups.push(gr);
        tick.addEventListener('click', function(){
          var all = gr.ids.every(function(id){return done[id]});
          gr.ids.forEach(function(id){ if(all) delete done[id]; else done[id]=true; });
          applyAll(); queueSave();
        });
      });
      main.appendChild(sec);
    });
    $('oTotal').textContent = allIds.length;
  }

  function count(ids){var n=0; ids.forEach(function(id){if(done[id]) n++}); return n}
  function applyAll(){
    allIds.forEach(function(id){ var r=rows[id], v=!!done[id]; r.box.checked=v; r.row.classList.toggle('done',v); });
    var total = allIds.length, n = count(allIds);
    $('oDone').textContent = n; $('oPct').textContent = Math.round(n/total*100)+'%'; $('oBar').style.width = (n/total*100)+'%';
    secs.forEach(function(s){ s.cnt.textContent = count(s.ids)+' / '+s.ids.length; });
    groups.forEach(function(g){
      var c = count(g.ids), t = g.ids.length;
      g.cnt.textContent = c+' / '+t; g.bar.style.width = (c/t*100)+'%';
      g.el.classList.toggle('full', c===t);
      g.tick.textContent = c===t ? 'Clear all in this group' : 'Tick all in this group';
    });
    applyFilters();
  }
  function setDone(id, v){ if(v) done[id]=true; else delete done[id]; applyAll(); queueSave(); }

  function applyFilters(){
    var a = $('app').classList;
    a.toggle('hide-spec', $('fSpec').checked); a.toggle('hide-p2', $('fP2').checked); a.toggle('hide-done', $('fDone').checked);
    groups.forEach(function(g){
      var hs=$('fSpec').checked, hp=$('fP2').checked, hd=$('fDone').checked;
      var any = g.ids.some(function(id){ var c=rows[id].row.classList; return !((hs&&c.contains('spec'))||(hp&&c.contains('p2'))||(hd&&c.contains('done'))); });
      g.el.hidden = !any;
    });
  }

  /* ---------- saving ---------- */
  var db = null, ref = null, saveTimer = null, saving = false, again = false, LS = 'edoc-api-checklist-v1';
  function setSync(state, msg){ var s=$('sync'); s.dataset.s=state; s.textContent=msg; }
  function ids(){ return Object.keys(done); }
  function queueSave(){
    setSync('saving','Saving…');
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
  }
  async function flush(){
    saveTimer = null;
    if(saving){ again = true; return; }
    saving = true;
    try{
      if(ref){ await ref.set({done: ids(), updatedAt: new Date().toISOString()}); setSync('saved','Saved'); }
      else { try{ localStorage.setItem(LS, JSON.stringify(ids())); setSync('local','Saved in this browser only'); }catch(e){ setSync('error','Could not save. Progress will be lost on reload.'); } }
    }catch(e){ setSync('error','Could not save, try ticking again.'); }
    finally{ saving = false; if(again){ again = false; flush(); } }
  }
  function useLocal(){
    try{ var v = JSON.parse(localStorage.getItem(LS)||'[]'); done = {}; v.forEach(function(id){ if(rows[id]) done[id]=true; }); }catch(e){}
    applyAll(); setSync('local','Saved in this browser only');
  }

  async function connect(){
    var timer = setTimeout(function(){ setSync('error','Saved progress is not reachable yet. Ticks may not be kept.'); }, 10000);
    try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
    if(!db){ clearTimeout(timer); useLocal(); return; }
    ref = db.doc('checklist/progress');
    ref.onSnapshot(function(snap){
      if(!snap.metadata.fromCache) clearTimeout(timer);
      if(saving || saveTimer) return;   // keep unsaved local ticks
      var d = snap.exists ? snap.data() : null; done = {};
      ((d && d.done) || []).forEach(function(id){ if(rows[id]) done[id]=true; });
      applyAll();
      if(!snap.metadata.fromCache) setSync('saved','Saved');
    }, function(){ clearTimeout(timer); ref = null; useLocal(); });
  }

  build();
  ['fSpec','fP2','fDone'].forEach(function(id){ $(id).addEventListener('change', applyFilters); });
  $('expand').addEventListener('click', function(){ groups.forEach(function(g){ g.el.open = true; }); });
  $('collapse').addEventListener('click', function(){ groups.forEach(function(g){ g.el.open = false; }); });
  applyAll();
  connect();
})();
</script>
